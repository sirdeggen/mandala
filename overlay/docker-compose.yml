services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
  overlay:
    build: .
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongodb:27017/mandala
    ports: ["8080:8080"]
    volumes: ["overlay-data:/data"]
    depends_on: ["mongodb"]
  # Go port of `overlay` (overlay-go/). Either service can serve the app —
  # point the frontend's VITE_OVERLAY_URL at whichever one is running
  # (http://localhost:8080 for `overlay`, http://localhost:8081 for
  # `overlay-go`). Both read/write the same Mongo database (`mandala`), so
  # they are interchangeable, not additive — don't run app traffic against
  # both at once.
  overlay-go:
    build:
      context: ../overlay-go
    env_file: ../overlay-go/.env
    environment:
      MONGO_URL: mongodb://mongodb:27017/mandala
    ports: ["8081:8080"]
    depends_on: ["mongodb"]
volumes:
  mongo-data:
  overlay-data:
